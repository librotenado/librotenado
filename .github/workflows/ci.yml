# SPDX-License-Identifier: MIT
# Format, lints and tests of the library on Linux and macOS; the written XRechnung checked by the KoSIT validator;
# dependencies (cargo deny). The licence check (REUSE) and a sign-off (DCO) on every commit of a pull request come
# from falkoss/starterpack, pinned by commit. Actions are pinned by commit, with the version as a comment, downloads by
# their SHA-256. On a version tag, the library goes to crates.io.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked

  xrechnung:
    runs-on: ubuntu-latest
    env:
      VALIDATOR: https://github.com/itplr-kosit/validator/releases/download/v1.6.3/validator-1.6.3-standalone.jar
      CONFIGURATION: https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/v2026-08-31/xrechnung-3.0.2-validator-configuration-2026-08-31.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: KoSIT validator 1.6.3 and XRechnung configuration 3.0.2
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfLo validator.jar "$VALIDATOR"
          curl -sSfLo configuration.zip "$CONFIGURATION"
          printf '%s  %s\n' \
            799e64befca97d4080e03608c80b85dd5a5ecc5f4ae4f35d1116ec2855b9a7c9 validator.jar \
            2530cd107c414511c5d0462ec10f886910395abfca820db82e83d70bf01221a8 configuration.zip | sha256sum -c -
          unzip -q configuration.zip -d configuration
          mkdir written
      - name: Every test invoice written as XRechnung in UBL and CII
        run: LIBROTENADO_EXPORT="$RUNNER_TEMP/written" cargo test --locked --test en16931 written_invoices_read_back_the_same
      - name: All of them accepted
        working-directory: ${{ runner.temp }}
        run: |
          java -jar validator.jar -s configuration/scenarios.xml -r configuration -o reports written/*.xml | tee result.txt
          grep -Eq 'Rejected: +0$' result.txt

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@4c37856fa8c0e9a415d1bf207a1d6ccefb1157b6
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@4c37856fa8c0e9a415d1bf207a1d6ccefb1157b6

  # The library on crates.io, on a release: in the tag's version, through crates.io's trusted publishing (a short-lived
  # token for this workflow and the environment `crates-io`, no stored secret). A version already on crates.io is left
  # alone, so the job can run again.
  crate:
    needs: [rust, xrechnung, dependencies, licences]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::librotenado is $version, the tag $GITHUB_REF_NAME"; exit 1; }
          if curl -fsS -A "librotenado release (https://github.com/librotenado/librotenado)" \
               "https://crates.io/api/v1/crates/librotenado/$version" >/dev/null 2>&1; then
            echo "librotenado $version is on crates.io already"; exit 0
          fi
          cargo publish --locked -p librotenado
