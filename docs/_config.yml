# SPDX-License-Identifier: MIT
# The librotenado documentation at librotenado.dev, built from this folder with Jekyll and the remote theme Just the
# Docs by .github/workflows/docs.yml – after docs/prepare.sh has brought in the specification, its data and the
# changelog, which live elsewhere in the repository, and with the API documentation of the library under api/. The
# files in assets/ are copies from librotenado/brand.
title: librotenado
description: The open protocol for accounting data in Europe – specification and reference library
url: https://librotenado.dev
lang: en

remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-redirect-from

color_scheme: librotenado
logo: /assets/librotenado-lockup-on-light.svg
favicon_ico: /assets/favicon.ico
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  librotenado.org: https://librotenado.org
  GitHub: https://github.com/librotenado/librotenado
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/librotenado/librotenado
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: "The specification is CC BY 4.0, the library MIT – librotenado is a <a href=\"https://falkoss.org\">falkOSS</a> project. <a href=\"https://falkoss.org/impressum.html\">Imprint</a> · <a href=\"https://falkoss.org/datenschutz.html\">Privacy</a>"

exclude:
  - prepare.sh

# Every page uses the theme's layout; the specification's parts, brought in by prepare.sh, sit under it.
defaults:
  - scope:
      path: ""
    values:
      layout: default
