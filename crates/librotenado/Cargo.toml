# SPDX-License-Identifier: MIT
[package]
name = "librotenado"
description = "Reference library of the librotenado protocol for accounting data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.15.1", default-features = false, features = ["x25519", "chacha", "alloc", "getrandom"] }
lopdf = { version = "0.46.0", optional = true }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[features]
default = ["pdf"]
# Reading the invoice embedded in a PDF (ZUGFeRD, Factur-X).
pdf = ["dep:lopdf"]

[dev-dependencies]
lopdf = "0.46.0"
